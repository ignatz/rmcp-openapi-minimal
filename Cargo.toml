[package]
name = "rmcp-openapi"
description = "Library for converting OpenAPI specifications to MCP tools"
readme = "../../README.md"
version = "0.31.3"
edition = "2024"
license = "MIT"
repository = "https://gitlab.com/lx-industries/rmcp-openapi"
homepage = "https://gitlab.com/lx-industries/rmcp-openapi"
keywords = ["mcp", "openapi", "llm"]
categories = ["network-programming", "web-programming"]

[lib]
name = "rmcp_openapi"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
bon = { version = "3.7", default-features = false }
heck = { version = "0.5.0", default-features = false }
jsonschema = "0.49.0"
mime = { version = "0.3.17", default-features = false }
oas3 = { version = "0.22", default-features = false }
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "json", "multipart", "form"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
# rmcp-actix-web = { version = "0.12.1", default-features = false, features = ["transport-streamable-http"], optional = true }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
serde_path_to_error = "0.1"
strsim = "0.11.1"
thiserror = "2.0"
tracing = "0.1"
url = "2.5.4"

[dev-dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = [] }
insta = { version = "1.43.1", features = ["json"] }
mockito = "1.7.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.0", default-features = false, features = ["fs", "process", "time"] }
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Enable this if your MCP service will forward tokens to upstream APIs (non-compliant).
# This violates MCP specifications but may be necessary for proxy architectures.
# See SECURITY.md for important security implications.
# authorization-token-passthrough = [
#     "rmcp-actix-web/authorization-token-passthrough",
# ]
